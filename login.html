<!doctype html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
name="description"
content="Login Kerjiva — Masuk ke akun pencari kerja atau perusahaan."

>

  <title>Login — Kerjiva</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }

    .kerjiva-login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      box-sizing: border-box;
    }

    .kerjiva-login-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 20px;
      padding: 34px 32px;
      box-sizing: border-box;
      box-shadow: 0 15px 45px rgba(15, 23, 42, 0.10);
    }

    .kerjiva-login-logo {
      display: block;
      width: 190px;
      height: auto;
      margin: 0 auto 24px;
    }

    .kerjiva-login-card h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #14213d;
      font-size: 28px;
    }

    .kerjiva-login-card > p {
      margin: 0 0 26px;
      text-align: center;
      color: #64748b;
      line-height: 1.5;
    }

    .login-role {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .login-role button {
      border: 1px solid #dbe3ec;
      background: #ffffff;
      color: #334155;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-role button.active {
      background: #123b6d;
      border-color: #123b6d;
      color: #ffffff;
    }

    .kerjiva-login-card label {
      display: block;
      margin-bottom: 16px;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
    }

    .kerjiva-login-card input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 7px;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .kerjiva-login-card input:focus {
      border-color: #123b6d;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 48px;
    }

    #toggleLoginPassword {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
    }

    #loginSubmitBtn {
      width: 100%;
      margin-top: 6px;
    }

    #loginMessage {
      min-height: 20px;
      margin: 14px 0 0;
      text-align: center;
      font-size: 14px;
      color: #64748b;
    }

    .login-links {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
    }

    .login-links a {
      color: #123b6d;
      font-weight: 600;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .kerjiva-login-card {
        padding: 28px 20px;
        border-radius: 16px;
      }

      .kerjiva-login-logo {
        width: 165px;
      }

      .kerjiva-login-card h1 {
        font-size: 25px;
      }
    }
  </style>

</head>

<body>

  <main class="kerjiva-login-page">

<section class="kerjiva-login-card">

  <img
    src="kerjiva.png"
    alt="Kerjiva"
    class="kerjiva-login-logo"
  >

  <h1 id="loginPageTitle">Masuk ke Kerjiva</h1>

  <p id="loginPageDescription">
     Masuk ke akun Anda untuk melanjutkan.
   </p>

  <div class="login-role">

   <button
     type="button"
     id="loginJobseekerRole"
     class="active"
   >
    👤 <span id="loginJobseekerRoleText">Pencari Kerja</span>
   </button>

   <button
     type="button"
     id="loginCompanyRole"
   >
   🏢 <span id="loginCompanyRoleText">Perusahaan</span>
   </button>

  </div>

  <form id="loginPageForm">

  <label>
  <span id="loginEmailLabel">Email</span>

  <input
    id="loginPageEmail"
    type="email"
    required
    placeholder="nama@email.com"
    autocomplete="email"
  >
</label>
      <label>
       <span id="loginPasswordLabel">Password</span>

       <div class="password-wrap">

       <input
         id="loginPagePassword"
         type="password"
         required
        minlength="6"
        placeholder="Minimal 6 karakter"
        autocomplete="current-password"
        >
        <button
          type="button"
          id="toggleLoginPassword"
          aria-label="Tampilkan password"
        >
          👁️
        </button>

      </div>
    </label>

    <button
      type="submit"
      class="btn btn-primary"
      id="loginSubmitBtn"
    >
      Masuk
    </button>

    <p id="loginMessage"></p>

  </form>

  <div class="login-links">

   <a href="index.html">
      <span id="loginBackLink">← Kembali ke Kerjiva</span>
   </a>

  </div>

</section>

  </main>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // ==================================================
  // KONFIGURASI SUPABASE KERJIVA
  // ==================================================
  const SUPABASE_URL =
    "https://ksqrimmecpriyepsuclc.supabase.co/rest/v1/";

  const SUPABASE_KEY =
    "sb_publishable_xvPQL9oniSRwZoqmSc5W4A_NS9ldWIL";

  const supabaseAuth =
    window.supabase.createClient(
      SUPABASE_URL.replace("/rest/v1/", ""),
      SUPABASE_KEY,
      {
        auth: {
          flowType: "implicit",
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );


  // ==================================================
  // ROLE LOGIN
  // ==================================================

  let loginPageRole = "jobseeker";
  const loginLanguage =
    localStorage.getItem("siteLanguage") || "id";

 const isLoginEnglish =
   loginLanguage === "en";
  
  if (isLoginEnglish) {
     document.documentElement.lang = "en";
    
      document.getElementById("toggleLoginPassword").setAttribute(
       "aria-label",
       "Show password"
      );
    
     document.getElementById("loginEmailLabel").textContent =
       "Email";

     document.getElementById("loginPasswordLabel").textContent =
       "Password";

     document.getElementById("loginPageEmail").placeholder =
       "name@email.com";

     document.getElementById("loginPagePassword").placeholder =
        "Minimum 6 characters";
    
     document.getElementById("loginJobseekerRoleText").textContent =
         "Job Seeker";

     document.getElementById("loginCompanyRoleText").textContent =
      "Company";
    
      document.getElementById("loginSubmitBtn").textContent =
       "Log In";

     document.getElementById("loginPageTitle").textContent =
      "Log In to Kerjiva";
    
    document.getElementById("loginBackLink").textContent =
     "← Back to Kerjiva";

     document.getElementById("loginPageDescription").textContent =
       "Log in to your account to continue.";
    
     } else {
       document.documentElement.lang = "id";
    
      document.getElementById("toggleLoginPassword").setAttribute(
        "aria-label",
        "Tampilkan password"
      );
    
      document.getElementById("loginEmailLabel").textContent =
        "Email";

      document.getElementById("loginPasswordLabel").textContent =
       "Password";

      document.getElementById("loginPageEmail").placeholder =
       "nama@email.com";

      document.getElementById("loginPagePassword").placeholder =
        "Minimal 6 karakter";
    
      document.getElementById("loginJobseekerRoleText").textContent =
         "Pencari Kerja";

      document.getElementById("loginCompanyRoleText").textContent =
         "Perusahaan";
    
      document.getElementById("loginSubmitBtn").textContent =
         "Masuk";

      document.getElementById("loginPageTitle").textContent =
          "Masuk ke Kerjiva";
    
      document.getElementById("loginBackLink").textContent =
          "← Kembali ke Kerjiva";

     document.getElementById("loginPageDescription").textContent =
        "Masuk ke akun Anda untuk melanjutkan.";
       }

  const jobseekerRoleBtn =
    document.getElementById("loginJobseekerRole");

  const companyRoleBtn =
    document.getElementById("loginCompanyRole");


  jobseekerRoleBtn.addEventListener("click", () => {

    loginPageRole = "jobseeker";

    jobseekerRoleBtn.classList.add("active");
    companyRoleBtn.classList.remove("active");

  });


  companyRoleBtn.addEventListener("click", () => {

    loginPageRole = "company";

    companyRoleBtn.classList.add("active");
    jobseekerRoleBtn.classList.remove("active");

  });


  // ==================================================
  // TAMPILKAN / SEMBUNYIKAN PASSWORD
  // ==================================================

  document
    .getElementById("toggleLoginPassword")
    .addEventListener("click", () => {

      const password =
        document.getElementById("loginPagePassword");

      password.type =
        password.type === "password"
          ? "text"
          : "password";

    });


  // ==================================================
  // LOGIN
  // ==================================================

  document
    .getElementById("loginPageForm")
    .addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document
          .getElementById("loginPageEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPagePassword")
          .value;

      const message =
        document.getElementById("loginMessage");

      const submitBtn =
        document.getElementById("loginSubmitBtn");

      message.textContent =
        isLoginEnglish
          ? "Logging in..."
          : "Sedang masuk...";

      submitBtn.disabled = true;

      try {

        // ==================================================
        // LOGIN SUPABASE
        // ==================================================

        const authUrl =
          SUPABASE_URL.replace("/rest/v1/", "") +
          "/auth/v1";

        const response =
          await fetch(
            `${authUrl}/token?grant_type=password`,
            {
              method: "POST",

              headers: {
                apikey: SUPABASE_KEY,
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                email,
                password
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data?.error_description ||
            data?.msg ||
            (
              isLoginEnglish
                ? "Invalid email or password."
                : "Email atau password salah."
            )
          );

        }

        if (!data?.user?.id) {

          throw new Error(
            isLoginEnglish
              ? "User account could not be verified."
              : "Akun pengguna tidak dapat diverifikasi."
          );

        }

        // ==================================================
        // SIMPAN SESSION KERJIVA
        // ==================================================

        localStorage.setItem(
          "kerjivaAccessToken",
          data.access_token
        );

        localStorage.setItem(
          "kerjivaUser",
          JSON.stringify(data.user)
        );

        // ==================================================
        // ROLE AKTIF SESUAI PILIHAN LOGIN
        // ==================================================

        localStorage.setItem(
          "kerjivaActiveRole",
          loginPageRole
        );

        // ==================================================
        // SINKRONKAN SESSION KE SUPABASE AUTH
        // ==================================================

        if (
          data.access_token &&
          data.refresh_token
        ) {

          const { error: sessionError } =
            await supabaseAuth.auth.setSession({
              access_token:
                data.access_token,

              refresh_token:
                data.refresh_token
            });

          if (sessionError) {

            console.error(
              "Gagal menyimpan session Supabase:",
              sessionError
            );

          }

        }

        // ==================================================
        // LOGIN BERHASIL
        // ==================================================

        message.textContent =
          isLoginEnglish
            ? "Login successful."
            : "Login berhasil.";

        // ==================================================
        // MASUK KE SISTEM KERJIVA YANG SUDAH ADA
        // ==================================================

        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 500);

      } catch (error) {

        console.error(
          "Login error:",
          error
        );

        message.textContent =
          error.message ||
          (
            isLoginEnglish
              ? "Login failed. Please try again."
              : "Login gagal. Silakan coba lagi."
          );

        submitBtn.disabled = false;

      }

    });


  });
