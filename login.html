
<!doctype html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Login Kerjiva — Masuk ke akun pencari kerja atau perusahaan."
  >

  <title>Login — Kerjiva</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }

    .kerjiva-login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      box-sizing: border-box;
    }

    .kerjiva-login-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 20px;
      padding: 34px 32px;
      box-sizing: border-box;
      box-shadow: 0 15px 45px rgba(15, 23, 42, 0.10);
    }

    .kerjiva-login-logo {
      display: block;
      width: 190px;
      height: auto;
      margin: 0 auto 24px;
    }

    .kerjiva-login-card h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #14213d;
      font-size: 28px;
    }

    .kerjiva-login-card > p {
      margin: 0 0 26px;
      text-align: center;
      color: #64748b;
      line-height: 1.5;
    }

    .login-role {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .login-role button {
      border: 1px solid #dbe3ec;
      background: #ffffff;
      color: #334155;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-role button.active {
      background: #123b6d;
      border-color: #123b6d;
      color: #ffffff;
    }

    .kerjiva-login-card label {
      display: block;
      margin-bottom: 16px;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
    }

    .kerjiva-login-card input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 7px;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .kerjiva-login-card input:focus {
      border-color: #123b6d;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 48px;
    }

 #toggleLoginPassword {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  cursor: pointer;
  padding: 4px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #64748b;
}
    #loginSubmitBtn {
      width: 100%;
      margin-top: 6px;
    }

    #loginMessage {
      min-height: 20px;
      margin: 14px 0 0;
      text-align: center;
      font-size: 14px;
      color: #64748b;
    }

    .login-links {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
    }

    .login-links a {
      color: #123b6d;
      font-weight: 600;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .kerjiva-login-card {
        padding: 28px 20px;
        border-radius: 16px;
      }

      .kerjiva-login-logo {
        width: 165px;
      }

      .kerjiva-login-card h1 {
        font-size: 25px;
      }
    }
  </style>

</head>

<body>

  <main class="kerjiva-login-page">

    <section class="kerjiva-login-card">

      <img
        src="kerjiva.png"
        alt="Kerjiva"
        class="kerjiva-login-logo"
      >

      <h1 id="loginPageTitle">
        Masuk ke Kerjiva
      </h1>

      <p id="loginPageDescription">
        Masuk ke akun Anda untuk melanjutkan.
      </p>

      <div class="login-role">

        <button
          type="button"
          id="loginJobseekerRole"
          class="active"
        >
          👤
          <span id="loginJobseekerRoleText">
            Pencari Kerja
          </span>
        </button>

        <button
          type="button"
          id="loginCompanyRole"
        >
          🏢
          <span id="loginCompanyRoleText">
            Perusahaan
          </span>
        </button>

      </div>

      <form id="loginPageForm">

        <label>

          <span id="loginEmailLabel">
            Email
          </span>

          <input
            id="loginPageEmail"
            type="email"
            required
            placeholder="nama@email.com"
            autocomplete="email"
          >

        </label>

        <label>

          <span id="loginPasswordLabel">
            Password
          </span>

          <div class="password-wrap">

            <input
              id="loginPagePassword"
              type="password"
              required
              minlength="6"
              placeholder="Minimal 6 karakter"
              autocomplete="current-password"
            >

       <button
             type="button"
             id="toggleLoginPassword"
             aria-label="Tampilkan password"
             >
              <svg
              id="loginPasswordEye"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              >
           <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
           <circle cx="12" cy="12" r="3"></circle>
           </svg>
           </button>
          </div>

        </label>

        <button
          type="submit"
          class="btn btn-primary"
          id="loginSubmitBtn"
        >
          Masuk
        </button>

        <p id="loginMessage"></p>

      </form>

      <div class="login-links">

        <a href="index.html">

          <span id="loginBackLink">
            ← Kembali ke Kerjiva
          </span>

        </a>

      </div>

    </section>

  </main>


  <script>

    // ==================================================
    // SUPABASE
    // MENGIKUTI app.js
    // ==================================================

    const SUPABASE_URL =
      "https://ksqrimmecpriyepsuclc.supabase.co/rest/v1/";

    /*
      PENTING:
      Ini harus sama persis dengan SUPABASE_KEY di app.js.
    */
    const SUPABASE_KEY =
      "sb_publishable_xvPQL9oniSRwZoqmSc5W4A_NS9ldWIL";


    const supabaseAuth =
      window.supabase.createClient(
        SUPABASE_URL.replace("/rest/v1/", ""),
        SUPABASE_KEY,
        {
          auth: {
            flowType: "implicit",
            detectSessionInUrl: true,
            persistSession: true,
            autoRefreshToken: true
          }
        }
      );


    // ==================================================
    // ELEMENT
    // ==================================================

    const jobseekerRoleBtn =
      document.getElementById("loginJobseekerRole");

    const companyRoleBtn =
      document.getElementById("loginCompanyRole");

    const passwordToggle =
      document.getElementById("toggleLoginPassword");

    const passwordInput =
      document.getElementById("loginPagePassword");

    const loginForm =
      document.getElementById("loginPageForm");

    const emailInput =
      document.getElementById("loginPageEmail");

    const message =
      document.getElementById("loginMessage");

    const submitBtn =
      document.getElementById("loginSubmitBtn");


    // ==================================================
    // BAHASA
    // ==================================================

    const loginLanguage =
      localStorage.getItem("siteLanguage") || "id";

    const isLoginEnglish =
      loginLanguage === "en";

    document.documentElement.lang =
      isLoginEnglish ? "en" : "id";


    if (isLoginEnglish) {

      document.getElementById("loginPageTitle").textContent =
        "Log In to Kerjiva";

      document.getElementById("loginPageDescription").textContent =
        "Log in to your account to continue.";

      document.getElementById("loginJobseekerRoleText").textContent =
        "Job Seeker";

      document.getElementById("loginCompanyRoleText").textContent =
        "Company";

      document.getElementById("loginPasswordLabel").textContent =
        "Password";

      document.getElementById("loginPageEmail").placeholder =
        "name@email.com";

      document.getElementById("loginPagePassword").placeholder =
        "Minimum 6 characters";

      document.getElementById("loginSubmitBtn").textContent =
        "Log In";

      document.getElementById("loginBackLink").textContent =
        "← Back to Kerjiva";

      passwordToggle.setAttribute(
        "aria-label",
        "Show password"
      );

    }


    // ==================================================
    // ROLE
    // MENGIKUTI app.js
    //
    // jobseeker = Pencari Kerja
    // company   = Perusahaan
    // ==================================================

    let loginPageRole =
      "jobseeker";


    jobseekerRoleBtn.addEventListener(
      "click",
      () => {

        loginPageRole =
          "jobseeker";

        jobseekerRoleBtn.classList.add(
          "active"
        );

        companyRoleBtn.classList.remove(
          "active"
        );

      }
    );


    companyRoleBtn.addEventListener(
      "click",
      () => {

        loginPageRole =
          "company";

        companyRoleBtn.classList.add(
          "active"
        );

        jobseekerRoleBtn.classList.remove(
          "active"
        );

      }
    );


 // ==================================================
// PASSWORD
// ==================================================

const eyeOpen =
  `<svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
    <circle cx="12" cy="12" r="3"></circle>
  </svg>`;

const eyeClosed =
  `<svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">
    <path d="M3 3l18 18"></path>
    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.2 4.1"></path>
    <path d="M6.2 6.2C3.6 8 2 12 2 12s3.5 7 10 7c1.5 0 2.8-.3 4-.8"></path>
  </svg>`;

passwordToggle.innerHTML = eyeOpen;

passwordToggle.addEventListener(
  "click",
  () => {

    if (
      passwordInput.type === "password"
    ) {

      passwordInput.type = "text";

      passwordToggle.innerHTML =
        eyeClosed;

      passwordToggle.setAttribute(
        "aria-label",
        "Sembunyikan password"
      );

    } else {

      passwordInput.type =
        "password";

      passwordToggle.innerHTML =
        eyeOpen;

      passwordToggle.setAttribute(
        "aria-label",
        "Tampilkan password"
      );

    }

  }
);
    // ==================================================
    // NOTIFICATION
    // ==================================================

    function showLoginNotification(
      notificationMessage
    ) {

      const notification =
        document.createElement("div");

      notification.textContent =
        notificationMessage;

      notification.style.position =
        "fixed";

      notification.style.top =
        "20px";

      notification.style.left =
        "50%";

      notification.style.transform =
        "translateX(-50%)";

      notification.style.zIndex =
        "99999";

      notification.style.padding =
        "14px 22px";

      notification.style.borderRadius =
        "10px";

      notification.style.background =
        "#1f2937";

      notification.style.color =
        "#ffffff";

      notification.style.fontSize =
        "15px";

      notification.style.fontWeight =
        "500";

      notification.style.boxShadow =
        "0 6px 20px rgba(0,0,0,0.25)";

      notification.style.textAlign =
        "center";

      document.body.appendChild(
        notification
      );

      setTimeout(
        () => {
          notification.remove();
        },
        3000
      );

    }
    // ==================================================
// CEK EMAIL TERDAFTAR
// SISTEM BERSAMA KERJIVA
// ==================================================

async function isKerjivaEmailRegistered(email) {

  const response = await fetch(
    `${SUPABASE_URL}rpc/check_email_registered`,
    {
      method: "POST",

      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        check_email: email
      })
    }
  );

  if (!response.ok) {
    throw new Error(
      "EMAIL_CHECK_FAILED"
    );
  }

  return await response.json();
}


    // ==================================================
    // LOGIN
    // MENGIKUTI AUTH app.js
    // ==================================================

    loginForm.addEventListener(
      "submit",
      async (e) => {

        e.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


       message.textContent =
  isLoginEnglish
    ? "Checking email..."
    : "Memeriksa email...";

submitBtn.disabled =
  true;

try {

  // ==================================================
  // CEK EMAIL TERDAFTAR SEBELUM LOGIN
  // ==================================================

  const emailRegistered =
    await isKerjivaEmailRegistered(email);

  if (!emailRegistered) {

    message.textContent = "";

    showLoginNotification(
      isLoginEnglish
        ? "This email is not registered. Please register first."
        : "Email ini belum terdaftar. Silakan daftar terlebih dahulu."
    );

    submitBtn.disabled = false;

    return;
  }

  // ==================================================
  // EMAIL TERDAFTAR → LANJUT KE LOGIN LAMA
  // ==================================================

          message.textContent =
          isLoginEnglish
          ? "Logging in..."
          : "Sedang masuk...";

            const authUrl =
            SUPABASE_URL.replace(
              "/rest/v1/",
              "/auth/v1/"
            );


          // ==================================================
          // AUTH SAMA SEPERTI app.js
          // ==================================================

          const response =
            await fetch(
              `${authUrl}/token?grant_type=password`,
              {
                method: "POST",

                headers: {
                  apikey: SUPABASE_KEY,
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email,
                  password
                })
              }
            );


          const data =
            await response.json();


          console.log(
            "LOGIN STATUS:",
            response.status
          );


          console.log(
            "LOGIN DATA:",
            data
          );


          if (!response.ok) {

            throw new Error(
              data.msg ||
              data.error_description ||
              data.message ||
              "Gagal"
            );

          }


          if (!data?.user?.id) {

            throw new Error(
              "USER_NOT_FOUND"
            );

          }


          // ==================================================
          // SESSION KERJIVA
          // ==================================================

          localStorage.setItem(
            "kerjivaUser",
            JSON.stringify(data.user)
          );


          if (data.access_token) {

            localStorage.setItem(
              "kerjivaAccessToken",
              data.access_token
            );

          }


          if (
            data.access_token &&
            data.refresh_token
          ) {

            await supabaseAuth.auth.setSession({
              access_token:
                data.access_token,

              refresh_token:
                data.refresh_token
            });

          }


          // ==================================================
          // CEK ROLE SESUAI app.js
          // ==================================================

          if (
            loginPageRole ===
            "jobseeker"
          ) {

            const profileResponse =
              await fetch(
                `${SUPABASE_URL}jobseeker_profiles?id=eq.${encodeURIComponent(data.user.id)}&select=id`,
                {
                  method: "GET",

                  headers: {
                    apikey:
                      SUPABASE_KEY,

                    Authorization:
                      `Bearer ${data.access_token}`
                  }
                }
              );


            if (!profileResponse.ok) {

              throw new Error(
                "PROFILE_CHECK_FAILED"
              );

            }


            const profileData =
              await profileResponse.json();


            if (
              !Array.isArray(profileData) ||
              profileData.length === 0
            ) {

              throw new Error(
                "JOBSEEKER_PROFILE_NOT_FOUND"
              );

            }

          }


          if (
            loginPageRole ===
            "company"
          ) {

            const companyResponse =
              await fetch(
                `${SUPABASE_URL}companies?user_id=eq.${encodeURIComponent(data.user.id)}&select=id`,
                {
                  method: "GET",

                  headers: {
                    apikey:
                      SUPABASE_KEY,

                    Authorization:
                      `Bearer ${data.access_token}`
                  }
                }
              );


            if (!companyResponse.ok) {

              throw new Error(
                "COMPANY_PROFILE_CHECK_FAILED"
              );

            }


            const companyData =
              await companyResponse.json();


            if (
              !Array.isArray(companyData) ||
              companyData.length === 0
            ) {

              throw new Error(
                "COMPANY_PROFILE_NOT_FOUND"
              );

            }

          }


          // ==================================================
          // ROLE AKTIF
          // SAMA SEPERTI app.js
          // ==================================================

          localStorage.setItem(
            "kerjivaActiveRole",
            loginPageRole
          );

          // ==================================================
          // BERHASIL
          // ==================================================

          message.textContent =
            isLoginEnglish
              ? "Login successful."
              : "Login berhasil.";

          setTimeout(
            () => {

              window.location.href =
                "index.html";

            },
            500
          );

           } catch (error) {

          console.error(
            "Login error:",
            error
          );

          let loginErrorMessage;

          if (
            error.message ===
            "JOBSEEKER_PROFILE_NOT_FOUND"
          ) {

            loginErrorMessage =
              isLoginEnglish
                ? "You do not have a Job Seeker profile."
                : "Anda belum memiliki profil Pencari Kerja.";

          } else if (
            error.message ===
            "COMPANY_PROFILE_NOT_FOUND"
          ) {

            localStorage.setItem(
              "kerjivaCompleteCompanyProfile",
              "true"
            );

            window.location.href =
              "index.html";

            return;

          } else if (
            error.message ===
            "PROFILE_CHECK_FAILED" ||
            error.message ===
            "COMPANY_PROFILE_CHECK_FAILED"
          ) {

            loginErrorMessage =
              isLoginEnglish
                ? "Unable to check your profile."
                : "Profil Anda tidak dapat diperiksa.";

          } else {

            loginErrorMessage =
              isLoginEnglish
                ? "Invalid email or password."
                : "Email atau password salah.";

          }

          message.textContent = "";

          showLoginNotification(
            loginErrorMessage
          );

          submitBtn.disabled = false;

        }

      }
    );

  </script>

</body>
</html>
